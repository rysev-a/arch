<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <rect x="7" y="7" width="10" height="10" rx="1.5" />
          <path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3" />
        </svg>
      </span>
      <div class="brand-text">
        <h1 class="app-title">Как работает процессор</h1>
        <p class="app-subtitle">Интерактивный тренажёр: от логических элементов к схемам</p>
      </div>
    </div>

    <div class="header-actions">
      <button
        type="button"
        class="btn btn-outline btn-icon menu-btn"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
        title="Разделы"
        aria-label="Показать или скрыть список разделов"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-outline btn-icon"
        (click)="toggleTheme()"
        [title]="theme() === 'dark' ? 'Светлая тема' : 'Тёмная тема'"
        [attr.aria-label]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
      >
        @if (theme() === 'dark') {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>

<div class="app-shell">
  <aside class="app-side" [class.open]="menuOpen()">
    <app-side-nav (navigated)="menuOpen.set(false)" />
  </aside>

  <div class="app-content">
    <main class="app-main">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <span>Сделано на Angular · SVG · signals</span>
      <span class="dot-sep">·</span>
      <span>Серия «От вентиля к процессору»</span>
    </footer>
  </div>
</div>
