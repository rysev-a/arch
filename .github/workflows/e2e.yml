# Сквозные тесты в настоящем браузере (Playwright). Выкладку на Pages не блокируют — это отдельная проверка.
name: Сквозные тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Браузер для тестов
        run: npx playwright install --with-deps chromium

      - name: Сквозные тесты
        run: npm run e2e

      - name: Отчёт (если тесты упали)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
